  <metadata id="banner-spec">{"name": "pest-plugin-visualizations", "tagline": "Fluent Pest assertions for DataGrids, Charts and Metrics.", "accent": ["#8B5CF6", "#0EA5E9"], "motif": "&lt;line x1='884' y1='142' x2='884' y2='238' stroke='#94A3B8' stroke-width='2.5' opacity='0.5'/&gt;&lt;g font-family='{mono}' font-size='13' fill='#94A3B8' opacity='0.75'&gt;&lt;text x='872' y='128'&gt;dataGrid(Users::class)&lt;/text&gt;&lt;text x='900' y='164'&gt;-&gt;assertHasColumn('Name')&lt;/text&gt;&lt;text x='900' y='196'&gt;-&gt;usingSorts($sort)&lt;/text&gt;&lt;/g&gt;&lt;rect x='892' y='210' width='186' height='28' rx='6' fill='#0EA5E9' fill-opacity='0.08' stroke='url(#accent)' stroke-width='3' stroke-dasharray='6 5'/&gt;&lt;text x='900' y='229' font-family='{mono}' font-size='13' fill='#F1F5F9'&gt;-&gt;assertRowCount(1)&lt;/text&gt;&lt;text x='900' y='274' font-family='{mono}' font-size='12' fill='#64748B'&gt;✓ 1 passed (3 assertions)&lt;/text&gt;"}</metadata>
